<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="description" content="Contact A Plus Express (APX) — call, chat, visit, or follow us online." />
  <meta name="robots" content="index, follow" />
  <title>A Plus Express (APX) — Contact Hub</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="A Plus Express (APX) — Contact Hub" />
  <meta property="og:description" content="Contact A Plus Express (APX) — call, chat, visit, or follow us online." />
  <meta property="og:site_name" content="A Plus Express (APX)" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" crossorigin="anonymous" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --red: #dc2626;
      --text: #0f172a;
      --muted: #64748b;
      --surface: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      --shadow-hover: 0 16px 40px rgba(15, 23, 42, 0.12);
      --radius: 18px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(900px 400px at 50% -10%, rgba(37, 99, 235, 0.12), transparent 60%),
        linear-gradient(180deg, #f8fafc 0%, #ffffff 45%, #f1f5f9 100%);
      color: var(--text);
      min-height: 100dvh;
      padding: calc(24px + var(--safe-top)) 16px calc(32px + var(--safe-bottom));
      line-height: 1.55;
      overflow-x: hidden;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .page { max-width: 720px; }
      .actions {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px !important;
      }
      .actions > li:last-child:nth-child(odd) {
        grid-column: 1 / -1;
        max-width: 360px;
        margin: 0 auto;
        width: 100%;
      }
    }

    .top-bar {
      height: 5px;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue) 40%, var(--red));
      margin-bottom: 32px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--blue-dark), var(--blue));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
      box-shadow: var(--shadow);
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #1e3a8a, var(--blue) 50%, var(--red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--muted);
    }

    .divider {
      width: 56px;
      height: 3px;
      margin: 16px auto 0;
      border-radius: 3px;
      background: linear-gradient(90deg, transparent, var(--blue), var(--red), transparent);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      list-style: none;
    }

    .action {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 64px;
      padding: 16px 18px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.22s var(--ease), box-shadow 0.22s var(--ease), border-color 0.22s var(--ease);
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .action:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 2px;
    }

    @media (hover: hover) {
      .action:hover {
        transform: translateY(-3px);
        border-color: #cbd5e1;
        box-shadow: var(--shadow-hover);
      }
    }

    .action:active {
      transform: scale(0.98);
    }

    .icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
    }

    .icon--phone { background: #dcfce7; color: #16a34a; }
    .icon--whatsapp { background: #dcfce7; color: #25d366; }
    .icon--web { background: #dbeafe; color: var(--blue); }
    .icon--maps { background: #fee2e2; color: var(--red); }
    .icon--facebook { background: #dbeafe; color: #1877f2; }
    .icon--instagram {
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
    }
    .icon--youtube { background: #fee2e2; color: #ff0000; }
    .icon--tiktok { background: #f1f5f9; color: #010101; }
    .icon--email { background: #ede9fe; color: #7c3aed; }

    .label {
      flex: 1;
      text-align: left;
      line-height: 1.35;
    }

    .chevron {
      flex-shrink: 0;
      font-size: 1.1rem;
      color: #cbd5e1;
      transition: transform 0.22s var(--ease), color 0.22s var(--ease);
    }

    .action:hover .chevron {
      transform: translateX(3px);
      color: var(--blue);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: hub-ripple 0.55s ease-out;
      background: rgba(37, 99, 235, 0.15);
      pointer-events: none;
    }

    @keyframes hub-ripple {
      to { transform: scale(4); opacity: 0; }
    }

    footer.hub-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .action:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar" aria-hidden="true"></div>

    <header>
      <div class="logo-mark" aria-hidden="true">APX</div>
      <h1>A Plus Express (APX)</h1>
      <p class="subtitle">Choose how you'd like to connect with us</p>
      <div class="divider" aria-hidden="true"></div>
    </header>

    <nav aria-label="Contact options">
      <ul class="actions">
        <li>
          <a class="action apx-ripple-host" href="tel:+94775064678">
            <span class="icon icon--phone" aria-hidden="true"><i class="bi bi-telephone-fill"></i></span>
            <span class="label">Call Now</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="action apx-ripple-host" href="https://wa.me/94775064678" target="_blank" rel="noopener noreferrer">
            <span class="icon icon--whatsapp" aria-hidden="true"><i class="bi bi-whatsapp"></i></span>
            <span class="label">WhatsApp Chat</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="action apx-ripple-host" href="https://apx.lk" target="_blank" rel="noopener noreferrer">
            <span class="icon icon--web" aria-hidden="true"><i class="bi bi-globe2"></i></span>
            <span class="label">Website</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="action apx-ripple-host" href="https://www.google.com/maps/search/?api=1&amp;query=APX+A+Plus+Express+Jaffna+Sri+Lanka" target="_blank" rel="noopener noreferrer">
            <span class="icon icon--maps" aria-hidden="true"><i class="bi bi-geo-alt-fill"></i></span>
            <span class="label">Google Maps – Jaffna Branch</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="action apx-ripple-host" href="https://www.google.com/maps/search/?api=1&amp;query=APX+A+Plus+Express+Kilinochchi+Sri+Lanka" target="_blank" rel="noopener noreferrer">
            <span class="icon icon--maps" aria-hidden="true"><i class="bi bi-geo-alt-fill"></i></span>
            <span class="label">Google Maps – Kilinochchi Branch</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="action apx-ripple-host" href="https://www.facebook.com/aruran.A.plus.Digital" target="_blank" rel="noopener noreferrer">
            <span class="icon icon--facebook" aria-hidden="true"><i class="bi bi-facebook"></i></span>
            <span class="label">Facebook</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="action apx-ripple-host" href="https://www.instagram.com/a_plus_express/" target="_blank" rel="noopener noreferrer">
            <span class="icon icon--instagram" aria-hidden="true"><i class="bi bi-instagram"></i></span>
            <span class="label">Instagram</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="action apx-ripple-host" href="https://www.youtube.com/@aplus_express_official" target="_blank" rel="noopener noreferrer">
            <span class="icon icon--youtube" aria-hidden="true"><i class="bi bi-youtube"></i></span>
            <span class="label">YouTube</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="action apx-ripple-host" href="https://www.tiktok.com/@apx.lk" target="_blank" rel="noopener noreferrer">
            <span class="icon icon--tiktok" aria-hidden="true"><i class="bi bi-tiktok"></i></span>
            <span class="label">TikTok</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="action apx-ripple-host" href="mailto:info@apx.lk">
            <span class="icon icon--email" aria-hidden="true"><i class="bi bi-envelope-fill"></i></span>
            <span class="label">Email</span>
            <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </nav>

    <footer class="hub-footer">
      <p>A Plus Express (APX) &mdash; Your joyful journey is in our care</p>
    </footer>
  </div>

  <script>
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.addEventListener("click", function (e) {
        var el = e.target.closest(".apx-ripple-host");
        if (!el) return;
        var rect = el.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height);
        var ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.width = ripple.style.height = size + "px";
        ripple.style.left = e.clientX - rect.left - size / 2 + "px";
        ripple.style.top = e.clientY - rect.top - size / 2 + "px";
        el.appendChild(ripple);
        ripple.addEventListener("animationend", function () { ripple.remove(); });
      });
    })();
  </script>
</body>
</html>
