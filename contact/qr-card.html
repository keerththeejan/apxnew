<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APX Contact Hub QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f8fafc;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.1);
      padding: 32px 28px;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #1e3a8a, #2563eb 50%, #dc2626);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p { margin-top: 8px; color: #64748b; font-size: 0.9rem; }
    img {
      display: block;
      width: min(260px, 70vw);
      height: auto;
      margin: 24px auto 16px;
      border-radius: 12px;
    }
    .url {
      font-size: 0.75rem;
      color: #94a3b8;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>A Plus Express (APX)</h1>
    <p>Scan to open Contact Hub</p>
    <img src="apx-contact-hub-qr-preview.png" alt="QR code for APX Contact Hub" width="512" height="512" />
    <p class="url">https://apx.lk/contact</p>
  </div>
</body>
</html>
